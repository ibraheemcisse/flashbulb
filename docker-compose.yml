services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flashbulb
      POSTGRES_PASSWORD: flashbulb_dev
      POSTGRES_DB: flashbulb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:

